<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:'DM Sans','Segoe UI',system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050505;visibility:hidden;pointer-events:none}
.frame.on{visibility:visible;pointer-events:auto;z-index:1}
#prog{position:fixed;top:0;left:0;height:2px;width:0;background:#00e5ff;z-index:30;opacity:0;transition:width .4s ease,opacity .3s ease;box-shadow:0 0 10px #00e5ff}
#prog.go{opacity:1;width:80%;transition:width 6s cubic-bezier(.1,.7,.2,1)}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#050505;z-index:40;transition:opacity .3s}
#boot.hide{opacity:0;pointer-events:none}
.spin{width:44px;height:44px;border:3px solid #222;border-top-color:#00e5ff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
/* child-site only: a small way back to the league from borrowed panes (profile, settings, admin...) */
#back{display:none;position:fixed;right:14px;bottom:14px;z-index:20;background:rgba(10,10,10,.92);color:#fff;border:1px solid #00e5ff;border-radius:30px;padding:10px 16px;font:700 .75rem 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px)}
#back:hover{background:#00e5ff;color:#000}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>

  stage.appendChild(f); frames.set(page,f); return f;
}
function scrollTo_(f,a){if(!a)return;try{const el=f.contentDocument.getElementById(a);if(el)el.scrollIntoView({behavior:'smooth'});}catch(e){}}
function show(page,anchor){
  const f=makeFrame(page); pendingFrame=f; pendingPage=page;
  const reveal=()=>{
    if(pendingFrame!==f)return;
    frames.forEach(x=>x.classList.toggle('on',x===f)); graveyard.forEach(x=>{if(x!==f)x.remove();}); graveyard.clear();
    active=f; prog.className=''; boot.classList.add('hide');
    document.title=(CFG.titles[page]?CFG.titles[page]+' | ':'')+CFG.site;
    back.style.display=(CFG.mode==='child'&&CFG.backOn.includes(page))?'block':'none';
    try{f.contentWindow.postMessage({eepl:'show',page:page,anchor:anchor||''},'*');}catch(e){}
    if(pendingHome&&page==='home'){try{f.contentWindow.postMessage(pendingHome,'*');}catch(e){}pendingHome=null;}
    scrollTo_(f,anchor); scheduleWarm();
  };
  if(f.dataset.ready){reveal();return;}
  if(active)prog.className='go';
  f.addEventListener('load',reveal,{once:true}); setTimeout(()=>{if(pendingFrame===f&&!f.dataset.ready)reveal();},9000);
}
function purge(){ // the signed-in user changed: drop every cached page except the one on screen
  frames.forEach(x=>{ if(x===active)graveyard.add(x); else x.remove(); }); frames.clear();
}
function scheduleWarm(){
  clearTimeout(warmTimer);
  warmTimer=setTimeout(function step(){
    const next=CFG.warm.find(p=>!frames.has(p)&&PAGES[p]&&(user||!CFG.gate[p])&&p!==pendingPage);
    if(next&&frames.size<7){makeFrame(next);warmTimer=setTimeout(step,1200);}
  },1500);
}

/* ---------- saved-profile sync (single source of truth: user_profiles/<uid>) ---------- */
function syncProfile(u){
  if(profRef){profRef.off();profRef=null;}
  needsOnb=false;legacyOk=undefined;
  if(!u){['userName','userPfp','userBio','userRegion','isLoggedIn'].forEach(k=>localStorage.removeItem(k));return Promise.resolve();}
  localStorage.setItem('isLoggedIn','true');
  profRef=db.ref('user_profiles/'+u.uid);
  return new Promise(res=>{
    let first=true; const done=()=>{if(first){first=false;res();}};
    profRef.on('value',s=>{
      const p=s.val()||{}, name=p.username||u.displayName||(u.email?u.email.split('@')[0]:'Manager');
      if(!p.pfp&&!legacyTried){legacyTried=true;db.ref('users/'+u.uid).once('value').then(function(ls){var l=ls.val()||{},lp=l.profilePicture||l.photoURL;if(lp&&String(lp).indexOf('ui-avatars')<0&&profRef)profRef.update({pfp:lp}).catch(function(){});}).catch(function(){});}
      if(p.username||!isGoogle(u)){var wasOnb=needsOnb;needsOnb=false;done();if(ready&&wasOnb)route();}
      else{
        (legacyOk===undefined?db.ref('users/'+u.uid).once('value').then(function(ls){legacyOk=ls.exists();}).catch(function(){legacyOk=false;}):Promise.resolve())
          .then(function(){var was=needsOnb;needsOnb=!legacyOk;done();if(ready&&was!==needsOnb)route();});
      }
      localStorage.setItem('userName',name);
      const pfp=p.pfp||u.photoURL; if(pfp)localStorage.setItem('userPfp',pfp); else localStorage.removeItem('userPfp');
      p.bio?localStorage.setItem('userBio',p.bio):localStorage.removeItem('userBio');
      p.region?localStorage.setItem('userRegion',p.region):localStorage.removeItem('userRegion');
    },e=>{console.warn('Profile sync:',e.message);localStorage.setItem('userName',u.displayName||(u.email||'Manager').split('@')[0]);done();});
    setTimeout(done,1500);
  });
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);});
const mobileUA=()=>/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
async function isRegistered(u){
  try{
    if((await db.ref('user_profiles/'+u.uid+'/username').once('value')).exists())return true;
    return (await db.ref('users/'+u.uid).once('value')).exists();
  }catch(e){return false;}
}
var pendingHome=null;
function tellHome(code){pendingHome={eepl:'googleResult',code:code};}   // delivered once the fresh sign-in page is showing
// mode 'signup': new accounts continue to the team-name step. mode 'login': only accounts that already registered may sign in.
async function afterGoogle(res,mode){
  try{
    const u=res.user, isNew=!!(res.additionalUserInfo&&res.additionalUserInfo.isNewUser);
    if(mode==='login'&&isNew&&!(await isRegistered(u))){
      try{await u.delete();}catch(e){try{await auth.signOut();}catch(x){}}
      tellHome('no-account');
    }
  }catch(e){console.error(e);}
  finally{sessionStorage.removeItem('googlePending');googleBusy=false;route();}
}
async function googleSignIn(mode){
  mode=mode==='login'?'login':'signup';
  const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
  googleBusy=true;
  try{
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    if(mobileUA()){sessionStorage.setItem('googlePending',mode);await auth.signInWithRedirect(provider);return;}
    let res;
    try{res=await auth.signInWithPopup(provider);}
    catch(e){
      if(e.code==='auth/popup-blocked'){sessionStorage.setItem('googlePending',mode);await auth.signInWithRedirect(provider);return;}
      if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request'){googleBusy=false;route();return;}
      throw e;
    }
    await afterGoogle(res,mode);
  }catch(e){console.error(e);sessionStorage.removeItem('googlePending');googleBusy=false;alert(GOOGLE_MSG[e.code]||('Google sign-in failed: '+e.message));route();}
}
addEventListener('message',e=>{
  const d=e.data||{}, src=e.source;
  const ok=(active&&src===active.contentWindow)||(pendingFrame&&src===pendingFrame.contentWindow);
  if(!ok)return;                                    // ignore pre-loaded (hidden) pages
  if(d.eepl==='nav')go(d.page,d.hash);else if(d.eepl==='google')googleSignIn(d.mode);
  else if(d.eepl==='stale'&&Array.isArray(d.pages)){d.pages.forEach(function(p){var x=frames.get(p);if(x&&x!==active&&x!==pendingFrame){x.remove();frames.delete(p);}});}
});
addEventListener('hashchange',route);
auth.getRedirectResult().then(function(res){
  var m=sessionStorage.getItem('googlePending');
  if(res&&res.user&&m)return afterGoogle(res,m);
  sessionStorage.removeItem('googlePending');googleBusy=false;if(ready)route();
}).catch(function(e){console.error(e);sessionStorage.removeItem('googlePending');googleBusy=false;alert(GOOGLE_MSG[e.code]||('Google sign-in failed: '+e.message));if(ready)route();});
setTimeout(function(){if(googleBusy){googleBusy=false;if(ready)route();}},25000);
auth.onAuthStateChanged(u=>{
  const uid=u?u.uid:null, changed=ready&&uid!==lastUid; lastUid=uid; user=u;
  profReady=syncProfile(u);
  if(changed)purge();
  ready=true; route();
});
</script>
